<style>
  :root {
    --rs-bg: #f0f7fc;
    --rs-bg-soft: #e3eef8;
    --rs-bg-card: #ffffff;
    --rs-blue: #2492d6;
    --rs-blue-deep: #1872aa;
    --rs-blue-tint: #d6ebf8;
    --rs-red: #d93434;
    --rs-red-deep: #b22323;
    --rs-ink: #142235;
    --rs-ink-soft: #4a5a72;
    --rs-line: #d8e6f1;
    --max: 1180px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--rs-bg);
    color: var(--rs-ink);
    font-family: "PT Sans", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  img { max-width: 100%; display: block; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  a { color: var(--rs-blue); text-decoration: none; }

  .nav {
    position: sticky; top: 0; z-index: 50;
    background: rgba(240, 247, 252, 0.85);
    backdrop-filter: saturate(180%) blur(10px);
    -webkit-backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid transparent;
    transition: border-color .25s ease, background .25s ease;
  }
  .nav.is-scrolled { border-bottom-color: var(--rs-line); background: rgba(240, 247, 252, 0.95); }
  .nav-inner {
    max-width: var(--max); margin: 0 auto;
    padding: 10px 24px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
  }
  .nav-logo { display: flex; align-items: center; gap: 14px; color: var(--rs-ink); }
  .nav-heart { width: 44px; height: 44px; flex-shrink: 0; }
  .nav-logo-img {
    height: 116px; width: auto; display: block;
  }
  .nav-name {
    font-family: "PT Serif", Georgia, serif; font-weight: 700; line-height: 0.95;
    font-size: 24px; letter-spacing: -0.01em; display: flex; flex-direction: column;
  }
  .nav-name span:last-child { color: var(--rs-blue); font-style: italic; }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a {
    color: var(--rs-ink); font-weight: 700; font-size: 15px;
    padding: 6px 2px; position: relative;
  }
  .nav-links a::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 2px;
    background: var(--rs-red); transform: scaleX(0); transform-origin: left;
    transition: transform .25s ease;
  }
  .nav-links a:hover::after { transform: scaleX(1); }
  .nav-burger { display: none; width: 36px; height: 36px; flex-direction: column; justify-content: center; gap: 5px; align-items: center; }
  .nav-burger span { display: block; width: 22px; height: 2px; background: var(--rs-ink); }

  .nav-end { display: flex; align-items: center; gap: 24px; }
  .nav-social { display: flex; gap: 4px; align-items: center; }
  .nav-social a {
    width: 36px; height: 36px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--rs-ink);
    transition: background .15s ease, color .15s ease;
  }
  .nav-social a:hover { background: var(--rs-blue-tint); color: var(--rs-blue); }

  @media (max-width: 720px) {
    .nav-burger { display: flex; }
    .nav-heart { width: 36px; height: 36px; }
    .nav-name { font-size: 20px; }
    .nav-logo-img { height: 80px; }
    .nav-end { gap: 4px; }
    .nav-social a { width: 32px; height: 32px; }
    .nav-social a svg { width: 18px; height: 18px; }
    .nav-links {
      position: absolute; top: 100%; left: 0; right: 0;
      background: var(--rs-bg); border-bottom: 1px solid var(--rs-line);
      flex-direction: column; gap: 0; padding: 8px 24px 16px;
      max-height: 0; overflow: hidden; transition: max-height .25s ease;
    }
    .nav-links.open { max-height: 280px; }
    .nav-links a { padding: 12px 0; border-bottom: 1px solid var(--rs-line); }
    .nav-links a:last-child { border-bottom: 0; }
  }

  .section { max-width: var(--max); margin: 0 auto; padding: 96px 24px; }
  .section-head { max-width: 720px; margin-bottom: 56px; }
  .section-title {
    font-family: "PT Serif", Georgia, serif; font-weight: 700;
    font-size: clamp(36px, 5vw, 60px); line-height: 1.04; margin: 18px 0 20px;
    letter-spacing: -0.015em; color: var(--rs-ink);
  }
  .section-title em { font-style: italic; color: var(--rs-blue); }
  .section-sub { font-size: 19px; line-height: 1.55; color: var(--rs-ink-soft); max-width: 620px; text-wrap: pretty; }
  .kicker {
    display: inline-flex; align-items: center; gap: 14px;
    font-family: "PT Sans", sans-serif; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.16em;
    font-size: 12px; color: var(--rs-blue);
  }
  .kicker-line { width: 28px; height: 2px; background: var(--rs-red); display: inline-block; }

  .hero { max-width: var(--max); margin: 0 auto; padding: 56px 24px 64px; }
  .hero-grid { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 64px; align-items: center; }
  .hero-title {
    font-family: "PT Serif", Georgia, serif; font-weight: 700;
    font-size: clamp(54px, 7.5vw, 96px); line-height: 0.95;
    margin: 22px 0 28px; letter-spacing: -0.02em;
  }
  .hero-title em { font-style: italic; color: var(--rs-blue); }
  .hero-lead { font-size: 18px; line-height: 1.6; color: var(--rs-ink-soft); max-width: 540px; text-wrap: pretty; }
  .hero-sign { margin: 28px 0 32px; padding-left: 16px; border-left: 3px solid var(--rs-red); }
  .sig-name { font-family: "PT Serif", Georgia, serif; font-weight: 700; font-size: 17px; }
  .sig-role { font-size: 14px; color: var(--rs-ink-soft); margin-top: 2px; }
  .hero-cta {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--rs-blue); color: #fff; padding: 12px 20px; border-radius: 999px;
    font-weight: 700; font-size: 15px;
    border: 2px solid transparent;
    transition: background .2s ease, color .2s ease, border-color .2s ease, transform .2s ease;
  }
  .hero-cta:hover { background: var(--rs-blue-deep); transform: translateY(-1px); }
  .hero-ctas { display: inline-flex; gap: 12px; flex-wrap: wrap; }
  .hero-cta-secondary {
    background: transparent;
    color: var(--rs-blue);
    border-color: var(--rs-blue);
  }
  .hero-cta-secondary:hover {
    background: var(--rs-blue);
    color: #fff;
  }

  .hero-photo {
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .hero-photo img {
    width: 100%; height: auto;
    max-height: 640px;
    object-fit: contain;
  }
  .hero-photo::after {
    content: ""; position: absolute; right: -4px; top: 8%;
    width: 110px; height: 110px;
    background: var(--rs-red);
    -webkit-mask: var(--heart-mask) center/contain no-repeat;
            mask: var(--heart-mask) center/contain no-repeat;
    transform: rotate(-8deg);
    animation: pulse 1.5s cubic-bezier(.4,0,.2,1) infinite;
  }
  @keyframes pulse {
    0%   { transform: rotate(-8deg) scale(1); }
    15%  { transform: rotate(-8deg) scale(1.12); }
    30%  { transform: rotate(-8deg) scale(0.98); }
    45%  { transform: rotate(-8deg) scale(1.07); }
    60%, 100% { transform: rotate(-8deg) scale(1); }
  }

  @media (max-width: 860px) {
    .hero-grid { grid-template-columns: 1fr; gap: 32px; }
    .hero-photo { max-width: 480px; margin: 0 auto; width: 100%; }
  }

  .pri-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px;
  }
  .pri-card {
    background: var(--rs-bg-card);
    border: 1px solid var(--rs-line);
    border-radius: 16px;
    padding: 28px 28px 24px;
    text-align: left;
    display: flex; flex-direction: column; gap: 10px;
    transition: transform .2s ease, border-color .2s ease, box-shadow .25s ease;
    position: relative;
  }
  .pri-card:hover {
    border-color: var(--rs-blue);
    transform: translateY(-3px);
    box-shadow: 0 18px 40px -28px rgba(36, 146, 214, 0.45);
  }
  .pri-card-num {
    font-family: "PT Serif", Georgia, serif; font-style: italic; font-weight: 700;
    font-size: 36px; line-height: 1; color: var(--rs-blue); margin-bottom: 4px;
  }
  .pri-card-title {
    font-family: "PT Serif", Georgia, serif; font-weight: 700;
    font-size: 22px; line-height: 1.2; letter-spacing: -0.005em;
  }
  .pri-card-lead { color: var(--rs-ink-soft); font-size: 15.5px; line-height: 1.5; }
  .pri-card-more {
    margin-top: auto; padding-top: 12px;
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 14px; color: var(--rs-blue);
    transition: gap .2s ease;
  }
  .pri-card:hover .pri-card-more { gap: 12px; }

  @media (max-width: 720px) {
    .pri-grid { grid-template-columns: 1fr; }
  }

  .drawer-backdrop {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(20, 34, 53, 0);
    pointer-events: none;
    transition: background .3s ease;
  }
  .drawer-backdrop.is-open { background: rgba(20, 34, 53, 0.45); pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%;
    width: min(620px, 92vw);
    background: var(--rs-bg-card);
    box-shadow: -20px 0 60px -30px rgba(20, 34, 53, 0.4);
    transform: translateX(100%);
    transition: transform .35s cubic-bezier(.4, 0, .2, 1);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .drawer.is-open { transform: translateX(0); }
  .drawer-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 32px;
    border-bottom: 1px solid var(--rs-line);
    flex-shrink: 0;
  }
  .drawer-num {
    font-family: "PT Serif", Georgia, serif; font-style: italic; font-weight: 700;
    font-size: 36px; line-height: 1; color: var(--rs-blue);
  }
  .drawer-close {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--rs-bg-soft);
    display: flex; align-items: center; justify-content: center;
    color: var(--rs-ink);
    transition: background .15s ease;
  }
  .drawer-close:hover { background: var(--rs-blue-tint); }
  .drawer-body {
    overflow-y: auto;
    padding: 32px;
    flex: 1;
  }
  .drawer-title {
    font-family: "PT Serif", Georgia, serif; font-weight: 700;
    font-size: clamp(28px, 3.4vw, 36px); line-height: 1.1;
    letter-spacing: -0.01em; margin: 0 0 16px;
  }
  .drawer-lead {
    font-size: 18px; line-height: 1.5; color: var(--rs-ink);
    padding-left: 16px; border-left: 3px solid var(--rs-red);
    margin: 0 0 28px;
    text-wrap: pretty;
  }
  .drawer-section { margin-bottom: 24px; }
  .drawer-section:last-child { margin-bottom: 0; }
  .drawer-section-h {
    font-family: "PT Serif", Georgia, serif; font-weight: 700;
    font-size: 19px; color: var(--rs-blue);
    margin: 0 0 10px;
  }
  .drawer-p {
    font-size: 16px; line-height: 1.65; color: var(--rs-ink-soft);
    margin: 0 0 12px; text-wrap: pretty;
  }
  .drawer-p:last-child { margin-bottom: 0; }
  .drawer-p strong { color: var(--rs-ink); font-weight: 700; }

  .drawer-figure {
    margin: 6px 0 18px;
  }
  .drawer-figure img {
    width: 100%; height: auto;
    border-radius: 12px;
    display: block;
  }
  .drawer-figure figcaption {
    margin-top: 8px;
    font-size: 13px;
    color: var(--rs-ink-soft);
    font-style: italic;
    text-align: center;
    text-wrap: pretty;
  }

  @media (max-width: 480px) {
    .drawer-head, .drawer-body { padding-left: 22px; padding-right: 22px; }
  }

  .section-team { padding-top: 32px; }

  .section-contact { padding-top: 32px; }
  .section-contact .section-head { margin-bottom: 0; }
  .section-contact .section-sub a { font-weight: 700; }

  .team-leader {
    display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 48px; align-items: center;
    background: var(--rs-bg-card);
    border: 1px solid var(--rs-line);
    border-radius: 24px;
    padding: 40px;
    margin-bottom: 56px;
    width: 100%;
    text-align: left;
    transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .team-leader:hover {
    transform: translateY(-3px);
    border-color: var(--rs-blue);
    box-shadow: 0 18px 40px -28px rgba(36, 146, 214, 0.45);
  }
  .team-leader-photo { aspect-ratio: 4 / 5; display: flex; align-items: center; justify-content: center; }
  .team-leader-photo img { width: 100%; height: 100%; object-fit: contain; }
  .team-num {
    font-family: "PT Serif", Georgia, serif; font-style: italic; font-weight: 700;
    color: var(--rs-blue); font-size: 22px; margin-bottom: 12px;
  }
  .team-leader-name {
    font-family: "PT Serif", Georgia, serif; font-weight: 700;
    font-size: clamp(28px, 3.4vw, 40px); line-height: 1.05;
    margin: 0 0 8px; letter-spacing: -0.01em;
  }
  .team-leader-role { color: var(--rs-ink-soft); font-size: 17px; }
  .team-leader-job { color: var(--rs-ink-soft); font-size: 15px; margin-top: 4px; font-style: italic; }
  .team-leader-link {
    margin-top: 22px; display: inline-flex; align-items: center; gap: 8px;
    font-weight: 700; color: var(--rs-blue); font-size: 15px;
  }

  .team-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px 28px;
    margin-bottom: 64px;
  }
  .team-card {
    text-align: left; padding: 14px;
    border-radius: 18px;
    transition: background .2s ease, transform .25s ease;
  }
  .team-card:hover { background: var(--rs-bg-soft); transform: translateY(-3px); }
  .team-card-photo {
    aspect-ratio: 1 / 1; border-radius: 50%; overflow: hidden;
    background: var(--rs-bg-soft);
    margin-bottom: 18px;
    width: 72%; max-width: 240px;
  }
  .team-card-photo img { width: 100%; height: 100%; object-fit: cover; }
  .team-card-num {
    font-family: "PT Serif", Georgia, serif; font-style: italic; font-weight: 700;
    color: var(--rs-blue); font-size: 16px; margin-bottom: 4px;
  }
  .team-card-name { font-family: "PT Serif", Georgia, serif; font-weight: 700; font-size: 22px; line-height: 1.2; letter-spacing: -0.005em; }
  .team-card-role { color: var(--rs-ink-soft); font-size: 15px; margin-top: 4px; }

  @media (max-width: 860px) {
    .team-leader { grid-template-columns: 1fr; gap: 24px; padding: 24px; }
    .team-leader-photo { max-width: 320px; margin: 0 auto; }
    .team-grid { grid-template-columns: repeat(2, 1fr); gap: 24px 16px; }
  }
  @media (max-width: 480px) {
    .team-grid { grid-template-columns: 1fr; }
    .team-card-photo { max-width: 200px; }
  }

  .team-rest { border-top: 1px solid var(--rs-line); padding-top: 32px; }
  .team-rest-head {
    font-family: "PT Sans", sans-serif; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.14em; font-size: 12px; color: var(--rs-blue);
    margin-bottom: 12px;
  }
  .team-rest-list { display: flex; flex-direction: column; }
  .team-row {
    display: grid; grid-template-columns: 56px auto 1fr auto 24px;
    gap: 18px; align-items: baseline;
    padding: 14px 8px;
    border-bottom: 1px solid var(--rs-line);
    text-align: left;
    transition: background .15s ease, padding .2s ease;
  }
  .team-row:hover { background: var(--rs-bg-soft); padding-left: 14px; }
  .team-row--static { cursor: default; }
  .team-row--static:hover { background: transparent; padding-left: 8px; }
  .team-row-num { font-family: "PT Serif", Georgia, serif; font-style: italic; font-weight: 700; color: var(--rs-blue); font-size: 18px; }
  .team-row-name { font-family: "PT Serif", Georgia, serif; font-weight: 700; font-size: 18px; }
  .team-row-dots { border-bottom: 1px dotted var(--rs-line); align-self: end; margin-bottom: 7px; }
  .team-row-role { color: var(--rs-ink-soft); font-size: 15px; }
  .team-row-arrow { color: var(--rs-blue); display: inline-flex; align-items: center; }

  @media (max-width: 640px) {
    .team-row { grid-template-columns: 36px 1fr 20px; gap: 12px; }
    .team-row-dots, .team-row-role { display: none; }
  }

  .modal-backdrop {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(20, 34, 53, 0.55);
    backdrop-filter: blur(4px);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    animation: fade .2s ease;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--rs-bg-card);
    border-radius: 20px;
    max-width: 720px; width: 100%; max-height: calc(100vh - 48px); overflow: auto;
    position: relative;
    display: flex; flex-direction: column;
    animation: pop .25s cubic-bezier(.2,.7,.4,1.2);
  }
  /* Medailonky mají různou délku — modal se jí přizpůsobuje ve třech stupních
     (viz `size` v MemberModal): širší modal + větší fotka, ať dlouhý text
     nezůstane v úzkém sloupci vedle malé fotky a řádek nemá přes 75 znaků. */
  .modal.is-long { max-width: 880px; }
  .modal.is-xlong { max-width: 980px; }
  @keyframes pop { from { transform: translateY(12px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
  /* Sticky, aby křížek zůstal po ruce i u dlouhého medailonku, který se roluje.
     Záporný spodní margin = v toku nezabírá výšku, layout je stejný jako dřív. */
  .modal-close {
    position: sticky; top: 16px; align-self: flex-end; flex: none;
    margin: 16px 16px -52px 0; width: 36px; height: 36px;
    border-radius: 50%; background: var(--rs-bg-soft); display: flex; align-items: center; justify-content: center;
    color: var(--rs-ink); z-index: 2; transition: background .15s ease;
  }
  .modal-close:hover { background: var(--rs-blue-tint); }
  .modal-grid { display: grid; grid-template-columns: 220px 1fr; gap: 32px; padding: 36px; align-items: start; }
  .modal.is-long .modal-grid { grid-template-columns: 260px 1fr; gap: 40px; }
  .modal.is-xlong .modal-grid { grid-template-columns: 300px 1fr; gap: 44px; }
  .modal-photo { aspect-ratio: 4 / 5; display: flex; align-items: center; justify-content: center; }
  .modal-photo img { width: 100%; height: 100%; object-fit: contain; border-radius: 12px; }
  .modal-photo-placeholder {
    background: var(--rs-bg-soft); border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-photo-heart { width: 64px; height: 64px; opacity: .55; }
  /* Rezerva vpravo, ať text nikdy nezmizí pod sticky křížkem. */
  .modal-text { padding-right: 20px; }
  .modal-num {
    font-family: "PT Serif", Georgia, serif; font-style: italic; font-weight: 700;
    color: var(--rs-blue); font-size: 22px; margin-bottom: 8px;
  }
  .modal-name {
    font-family: "PT Serif", Georgia, serif; font-weight: 700;
    font-size: 30px; line-height: 1.1; letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  .modal-role { color: var(--rs-ink-soft); font-size: 15px; margin-bottom: 16px; }
  .modal-bio { color: var(--rs-ink-soft); font-size: 16px; line-height: 1.6; margin: 0; text-wrap: pretty; }
